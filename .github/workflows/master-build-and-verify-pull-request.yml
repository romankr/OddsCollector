name: Build and verify pull request

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Check code formatting
      run: dotnet format --verify-no-changes
    - name: Build and run SonarAnalyzer.CSharp
      run: dotnet build --no-restore --no-incremental -warnaserror
    - name: Test and check coverage
      run: >
        dotnet test --no-restore --verbosity normal
        --filter "TestCategory!=Integration"
        /p:CollectCoverage=true
        /p:CoverletOutputFormat=lcov
        /p:CoverletOutput=lcov.info
        /p:Threshold=70
        /p:ThresholdType=line
    - name: Upload coverage to Codecov
      if: always()
      uses: codecov/codecov-action@v7
      with:
        files: OddsCollector.Functions.UnitTests/lcov.info
        token: ${{ secrets.CODECOV_TOKEN }}

  integration-tests:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Install Azure Functions Core Tools
      run: npm install --global azure-functions-core-tools@4 --unsafe-perm true
    # The Cosmos DB emulator that the AppHost runs serves HTTPS with the development certificate.
    # On Linux, .NET trusts certificates through OpenSSL, which reads SSL_CERT_DIR. The trust directory of the
    # development certificate has to be listed there before trusting it: otherwise the tool reports only partial
    # trust and exits with code 4. The variable is also kept for the following steps (the tests).
    - name: Create and trust the HTTPS development certificate
      run: |
        export SSL_CERT_DIR="$HOME/.aspnet/dev-certs/trust:/usr/lib/ssl/certs"
        echo "SSL_CERT_DIR=$SSL_CERT_DIR" >> "$GITHUB_ENV"
        dotnet dev-certs https --trust
        dotnet dev-certs https --check --trust
    - name: Run integration tests
      run: dotnet test OddsCollector.Functions.IntegrationTests --verbosity normal
