name: Build and verify pull request

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Check code formatting
      run: dotnet format --verify-no-changes
    - name: Build and run SonarAnalyzer.CSharp
      run: dotnet build --no-restore --no-incremental -warnaserror
    - name: Test and check coverage
      run: >
        dotnet test --no-restore --verbosity normal
        --filter "TestCategory!=Integration"
        /p:CollectCoverage=true
        /p:CoverletOutputFormat=lcov
        /p:CoverletOutput=lcov.info
        /p:Threshold=70
        /p:ThresholdType=line

  integration-tests:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Install Azure Functions Core Tools
      run: npm install --global azure-functions-core-tools@4 --unsafe-perm true
    - name: Run integration tests
      run: dotnet test OddsCollector.Functions.IntegrationTests --verbosity normal
